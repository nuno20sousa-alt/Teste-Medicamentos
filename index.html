<!DOCTYPE html>="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue-900: #1e3a8a;
      --blue-800: #1e40af;
      --blue-700: #1d4ed8;
      --blue-600: #2563eb;
      --blue-50: #eff6ff;

      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-600: #475569;
      --slate-500: #64748b;
      --slate-300: #cbd5e1;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --slate-50: #f8fafc;

      --green-100: #dcfce7;
      --green-700: #15803d;

      --amber-100: #fef3c7;
      --amber-800: #92400e;

      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f6f8;
      color: var(--slate-900);
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      min-height: 100vh;
    }

    /* ===== HERO ===== */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.20), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(147,197,253,0.28), transparent 30%),
        linear-gradient(120deg, var(--blue-700), var(--blue-900));
      padding: 48px 16px 72px;
      color: white;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: auto;
      text-align: center;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.05;
      font-weight: 750;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 12px auto 28px;
      max-width: 720px;
      font-size: 16px;
      line-height: 1.55;
      opacity: 0.92;
    }

    .hero-search {
      background: white;
      border-radius: 18px;
      padding: 8px 10px 8px 16px;
      max-width: 780px;
      margin: auto;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 16px 42px rgba(2, 6, 23, 0.30);
    }

    .hero-search-icon {
      font-size: 18px;
      color: var(--slate-500);
      flex: 0 0 auto;
    }

    .hero-search input {
      border: none;
      outline: none;
      font-size: 16px;
      width: 100%;
      min-height: 42px;
      color: var(--slate-900);
      background: transparent;
    }

    .hero-search button {
      border: none;
      background: var(--slate-100);
      color: var(--slate-600);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .hero-search button:hover {
      background: var(--slate-200);
    }

    /* ===== APP BODY ===== */

    .app {
      max-width: 1040px;
      margin: -42px auto 44px;
      padding: 0 16px;
      position: relative;
      z-index: 2;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(226,232,240,0.9);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .summary-label {
      font-size: 12px;
      color: var(--slate-500);
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 750;
      color: var(--slate-900);
      letter-spacing: -0.03em;
    }

    .filters-panel {
      background: white;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 18px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--slate-200);
    }

    .filters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      color: var(--blue-700);
      cursor: pointer;
      user-select: none;
    }

    .filters-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filters-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      background: var(--blue-600);
      color: white;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--blue-700);
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    .filters-content {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }

    .filters-group {
      min-width: 0;
    }

    .filters-group.full {
      grid-column: 1 / -1;
    }

    .filters-group-title {
      font-size: 13px;
      color: var(--slate-600);
      margin-bottom: 8px;
      font-weight: 650;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--slate-300);
      background: var(--slate-50);
      color: var(--slate-700);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--blue-600);
      background: var(--blue-50);
    }

    .chip.active {
      background: var(--blue-600);
      color: white;
      border-color: var(--blue-600);
      box-shadow: 0 6px 14px rgba(37,99,235,0.24);
    }

    select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--slate-300);
      font-size: 13px;
      width: 100%;
      background: white;
      color: var(--slate-900);
      outline: none;
    }

    select:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .results-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--slate-600);
      font-size: 13px;
    }

    .results-toolbar strong {
      color: var(--slate-900);
    }

    .results-hint {
      text-align: right;
    }

    /* ===== CARDS ===== */

    .results-list {
      display: grid;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.07);
      border: 1px solid var(--slate-200);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.11);
      border-color: rgba(37,99,235,0.35);
    }

    .card.open {
      border-left: 4px solid var(--blue-600);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .card-title {
      min-width: 0;
    }

    .medicine-name {
      font-size: 16px;
      font-weight: 760;
      color: var(--slate-900);
      line-height: 1.35;
    }

    .medicine-dci {
      display: block;
      font-size: 14px;
      color: var(--slate-600);
      margin-top: 4px;
      line-height: 1.4;
    }

    .chevron {
      flex: 0 0 auto;
      color: var(--blue-700);
      font-size: 14px;
      margin-top: 3px;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 650;
      background: var(--slate-100);
      color: var(--slate-700);
    }

    .pill.green {
      background: var(--green-100);
      color: var(--green-700);
    }

    .pill.amber {
      background: var(--amber-100);
      color: var(--amber-800);
    }

    .pill.blue {
      background: var(--blue-50);
      color: var(--blue-800);
    }

    .card-details {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--slate-200);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
      font-size: 13px;
      color: var(--slate-700);
    }

    .detail-item {
      min-width: 0;
    }

    .detail-label {
      display: block;
      color: var(--slate-500);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .detail-value {
      font-weight: 650;
      color: var(--slate-800);
      overflow-wrap: anywhere;
    }

    mark {
      background: #fde68a;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty {
      background: white;
      text-align: center;
      padding: 40px 18px;
      color: var(--slate-600);
      border-radius: 16px;
      border: 1px solid var(--slate-200);
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.07);
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin: 20px 0 4px;
    }

    .load-more-btn {
      border: none;
      background: var(--blue-600);
      color: white;
      border-radius: 999px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(37,99,235,0.24);
    }

    .load-more-btn:hover {
      background: var(--blue-700);
    }

    @media (max-width: 760px) {
      .hero {
        padding-top: 34px;
        padding-bottom: 64px;
      }

      .hero-search {
        align-items: stretch;
        padding: 8px 10px 8px 14px;
      }

      .hero-search button {
        padding-inline: 10px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters-content {
        grid-template-columns: 1fr;
      }

      .card-details {
        grid-template-columns: 1fr;
      }

      .results-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .results-hint {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" src="./app.js"></script>
</body>
</html>
