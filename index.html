<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Consulta de Medicamentos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f6f8;
      color: #0f172a;
    }

    /* ===== HERO ===== */
    .hero {
      background:
        linear-gradient(120deg, #2563eb, #1e40af);
      padding: 48px 16px 64px;
      color: white;
    }

    .hero-content {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
    }

    .hero p {
      margin: 8px 0 24px;
      font-size: 16px;
      opacity: 0.9;
    }

    .hero-search {
      background: white;
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 700px;
      margin: auto;
      display: flex;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .hero-search span {
      font-size: 18px;
      margin-right: 10px;
      color: #64748b;
    }

    .hero-search input {
      border: none;
      outline: none;
      font-size: 16px;
      width: 100%;
    }

    /* ===== APP BODY ===== */
    .app {
      max-width: 900px;
      margin: -32px auto 40px;
      padding: 0 16px;
    }

    .filters-panel {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .filters-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #2563eb;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .filters-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }

    .badge {
      background: #2563eb;
      color: white;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    .filters-group {
      margin-bottom: 14px;
    }

    .filters-group-title {
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 13px;
      cursor: pointer;
    }

    .chip.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    select {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      width: 100%;
      max-width: 260px;
    }

    .results-info {
      font-size: 13px;
      color: #475569;
      margin-bottom: 12px;
    }

    /* ===== CARDS ===== */
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.12);
    }

    .card.open {
      border-left: 4px solid #2563eb;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chevron {
      color: #2563eb;
      font-size: 14px;
    }

    .card span {
      display: block;
      font-size: 14px;
      color: #475569;
      margin-top: 4px;
    }

    .card-details {
      margin-top: 12px;
      font-size: 13px;
      color: #334155;
    }

    .card-details p {
      margin: 6px 0;
    }

    mark {
      background: #fde68a;
      border-radius: 2px;
      padding: 0 2px;
    }

    .empty {
      text-align: center;
      padding: 40px 0;
      color: #64748b;
    }
  </style>
</head>

<body>
  <!-- HERO -->
  <div class="hero">
    <div class="hero-content">
      <h1>Consulta de Medicamentos</h1>
      <p>Pesquisa profissional por nome comercial ou substância ativa (DCI)</p>

      <div class="hero-search">
        <span>🔍</span>
        <input id="heroSearch" placeholder="Ex: Cystagon, Mercaptamina…" />
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="root" class="app"></div>

  <script type="text/babel" src="./app.js"></script>
</body>
</html>
